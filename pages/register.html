<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <span class="logo-icon">⚡</span>
                <h1 class="gradient-text">909</h1>
                <p class="auth-subtitle">Alexander</p>
                <p class="text-muted text-sm mt-1">Buat Akun Baru</p>
            </div>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" name="username" class="form-input has-icon" placeholder="Username unik" required autocomplete="username" autofocus>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Nomor HP</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">📱</span>
                        <input type="tel" name="phone" class="form-input has-icon" placeholder="0812xxxx" required autocomplete="tel">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" name="password" class="form-input has-icon" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block pulse-glow">
                    ✨ Daftar Sekarang
                </button>
            </form>
            
            <div class="auth-divider"><span>atau</span></div>
            
            <a href="#login" class="btn btn-outline btn-block">🔐 Sudah punya akun? Masuk</a>
            
            <p class="text-center mt-2" style="font-size:0.7rem;color:var(--text-muted);">&copy; 2026 909 - Alexander</p>
        </div>
    </div>
</div>
