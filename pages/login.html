<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <span class="logo-icon">⚡</span>
                <h1 class="gradient-text">909</h1>
                <p class="auth-subtitle">Alexander</p>
                <p class="text-muted text-sm mt-1">Platform Kolaborasi Konten Visual</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" name="username" class="form-input has-icon" placeholder="Username kamu" required autocomplete="username" autofocus>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" name="password" class="form-input has-icon" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>
                
                <div class="form-group flex-between text-sm">
                    <label class="flex gap-1" style="align-items:center;cursor:pointer;">
                        <input type="checkbox" id="rememberMe"> Ingat saya
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block pulse-glow">
                    🔐 Masuk ke Akun
                </button>
            </form>
            
            <div class="auth-divider"><span>atau</span></div>
            
            <a href="#register" class="btn btn-outline btn-block">✨ Daftar Akun Baru</a>
            
            <p class="text-center mt-2" style="font-size:0.7rem;color:var(--text-muted);">&copy; 2026 909 - Alexander</p>
        </div>
    </div>
</div>
