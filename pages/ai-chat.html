<div class="ai-chat-page">
    <div class="ai-chat-header">
        <div class="flex gap-2" style="align-items:center;">
            <div class="ai-avatar">🤖</div>
            <div>
                <h3>Rey</h3>
                <p class="text-muted text-sm">Online &bull; Teman ngobrol kamu</p>
            </div>
        </div>
        <button class="btn btn-sm btn-outline" id="clearAiChat">🗑️ Bersihkan</button>
    </div>

    <div class="ai-chat-messages" id="aiMessages">
        <div class="ai-chat-welcome">
            <div class="ai-avatar-large">🤖</div>
            <h3>Halo! Aku Rey 👋</h3>
            <p class="text-muted">Teman ngobrol santai kamu di 909 - Alexander. Cerita apa aja, aku dengerin kok~</p>
            <div class="ai-suggestions">
                <button class="btn btn-sm btn-outline ai-suggestion">Gimana cara upload konten?</button>
                <button class="btn btn-sm btn-outline ai-suggestion">Ada tips kolaborasi?</button>
                <button class="btn btn-sm btn-outline ai-suggestion">Cerita random aja deh</button>
            </div>
        </div>
    </div>

    <div class="ai-chat-input-area">
        <input type="text" id="aiInput" class="form-input" placeholder="Ketik pesan ke Rey...">
        <button class="btn btn-primary" id="aiSendBtn">Kirim</button>
    </div>
</div>
