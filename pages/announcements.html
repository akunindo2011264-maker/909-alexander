<div class="container">
    <div class="fade-in">
        <h1>📢 Pengumuman</h1>
        <p class="text-muted">Informasi penting dari Admin & Owner</p>
    </div>

    <div class="glass-card mt-2 fade-in fade-in-delay-1" id="announcementFormCard">
        <h3>📨 Kirim Pengumuman Baru</h3>
        <form id="announcementForm" class="mt-2">
            <div class="form-group">
                <label>Pesan Pengumuman</label>
                <textarea name="message" class="form-input" rows="4" placeholder="Tulis pengumuman penting di sini..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                📨 Kirim ke Semua Pengguna
            </button>
        </form>
    </div>

    <div class="mt-3 fade-in fade-in-delay-2">
        <h2>📋 Riwayat Pengumuman</h2>
        <div id="announcementList">
            <div class="glass-card text-center">
                <p class="text-muted">Belum ada pengumuman.</p>
            </div>
        </div>
    </div>
</div>
